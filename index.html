<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fort Reilly Foundation</title>
    <style>
      :root {
        --black: #0b0b0b;
        --tan: #c7a34a;
        --tan-dark: #9b7628;
        --white: #ffffff;
        --line: #ded8cc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--white);
        color: var(--black);
        font-family: Arial, Helvetica, sans-serif;
      }

      .main-nav {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 14px clamp(16px, 4vw, 48px);
        border-bottom: 3px solid var(--tan);
        background: var(--white);
      }

      .brand,
      .nav-button {
        font-weight: 900;
        text-decoration: none;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        color: var(--black);
      }

      .brand img {
        display: block;
        width: clamp(150px, 25vw, 260px);
        height: auto;
        max-height: 58px;
        object-fit: contain;
      }

      .main-nav nav {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .nav-button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        background: var(--tan);
        color: var(--black);
        padding: 0 16px;
        border: 1px solid var(--tan-dark);
        white-space: nowrap;
      }

      .nav-button.secondary {
        background: var(--black);
        color: var(--tan);
        border-color: var(--black);
      }

      .home {
        min-height: calc(100vh - 75px);
        display: grid;
        place-items: center;
        padding: 48px 18px;
        text-align: center;
      }

      .home img {
        width: min(620px, 100%);
        height: auto;
        max-height: 320px;
        object-fit: contain;
        margin-bottom: 32px;
      }

      .home h1 {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 5rem);
        line-height: 0.98;
      }

      @media (max-width: 620px) {
        .main-nav {
          padding: 10px;
          gap: 10px;
        }

        .brand img {
          width: clamp(118px, 34vw, 170px);
          max-height: 42px;
        }

        .main-nav nav {
          flex: 1;
          justify-content: flex-end;
          gap: 6px;
          flex-wrap: wrap;
        }

        .nav-button {
          min-height: 38px;
          padding: 0 8px;
          font-size: 0.76rem;
        }

        .home {
          min-height: calc(100vh - 63px);
          padding: 32px 14px;
        }

        .home img {
          max-height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <header class="main-nav">
      <a class="brand" href="index.html">
        <img src="frontend/assets/fort-reilly-logo-cropped.jpeg" alt="Fort Reilly Foundation">
      </a>
      <nav aria-label="Main navigation">
        <a class="nav-button secondary" href="frontend/index.html">AI Chatbot</a>
        <a class="nav-button" href="veteran-resources.html">Veteran Resources</a>
        <a class="nav-button" href="frontend/shop.html">Shop</a>
      </nav>
    </header>

    <main class="home">
      <div>
        <img src="frontend/assets/fort-reilly-logo-cropped.jpeg" alt="Fort Reilly Foundation">
        <h1>Fort Reilly Foundation</h1>
      </div>
    </main>
  </body>
</html>
