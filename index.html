<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fort Reilly Foundation</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #050505; color: white; font-family: Inter, sans-serif; overflow-x: hidden; }
    a { text-decoration: none; }
    img { display: block; max-width: 100%; }

    :root {
      --gold: #b79a5b;
      --gold-light: #d8bd72;
      --black: #050505;
      --panel: #111111;
      --soft: #cfcfcf;
    }

    /* Top logo spacing reduced by ~75% */
    .top-logo {
      background: #050505;
      padding: 6px 6%; /* reduced from 24px top/bottom */
      border-bottom: 1px solid rgba(183,154,91,.25);
      text-align: center;
    }

    /* Include all other CSS from your previous index.html for nav, hero, sections, footer, etc. */
  </style>
</head>

<body>
  <header class="top-logo">
    <img src="assets.gitkeep/logo-banner.PNG" alt="Fort Reilly Foundation">
  </header>

  <nav class="floating-nav">
    <a href="#" class="nav-logo">
      <img src="assets.gitkeep/fr-shield.PNG" alt="FR Shield">
    </a>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#about">About</a>
      <a href="#programs">Programs</a>
      <a href="#gear">Gear/Shop</a>
      <a href="#contact">Contact</a>
    </div>
    <a href="#donate" class="nav-donate">Donate</a>
  </nav>

  <main>
    <!-- Your hero, mission, story, events, donate sections go here as-is -->
  </main>

  <footer id="contact">
    <h3>Fort Reilly Foundation</h3>
    <p>fortreillyfoundation.org</p>
  </footer>

  <!-- AI Chat Widget (tan color, full functionality) -->
  <script>
    const WORKER_URL = "https://fort-reilly-chat.YOUR-SUBDOMAIN.workers.dev";

    const styles = `
      #chat-btn {
        position: fixed; bottom: 24px; right: 24px; z-index: 9999;
        background: #b79a5b; color: white; border: none; border-radius: 50px;
        padding: 14px 22px; font-size: 15px; font-weight: bold;
        cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        font-family: sans-serif;
      }
      #chat-box {
        display: none; position: fixed; bottom: 85px; right: 24px; z-index: 9999;
        width: 340px; height: 480px; background: #fff; border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.25); flex-direction: column;
        font-family: sans-serif; overflow: hidden;
      }
      #chat-header {
        background: #b79a5b; color: white; padding: 14px 16px;
        font-weight: bold; font-size: 15px;
      }
      #chat-header span { font-size: 12px; font-weight: normal; display: block; opacity: 0.85; }
      #chat-messages {
        flex: 1; overflow-y: auto; padding: 14px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .msg { max-width: 85%; padding: 10px 13px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
      .msg.user { background: #b79a5b; color: white; align-self: flex-end; border-bottom-right-radius: 3px; }
      .msg.bot { background: #f1f1f1; color: #222; align-self: flex-start; border-bottom-left-radius: 3px; }
      #chat-input-row {
        display: flex; border-top: 1px solid #eee; padding: 10px;
        gap: 8px; background: #fafafa;
      }
      #chat-input {
        flex: 1; border: 1px solid #ddd; border-radius: 8px;
        padding: 8px 12px; font-size: 14px; outline: none;
      }
      #chat-send {
        background: #b79a5b; color: white; border: none;
        border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px;
      }
      #chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
    `;

    const html = `
      <style>${styles}</style>
      <button id="chat-btn" onclick="toggleChat()">💬 Ask Us</button>
      <div id="chat-box">
        <div id="chat-header">
          Fort Reilly Foundation
          <span>Never Fight Alone — Ask us anything</span>
        </div>
        <div id="chat-messages">
          <div class="msg bot">Hello! I'm here to help answer questions about the Fort Reilly Foundation, veteran resources, or how you can get involved. How can I help?</div>
        </div>
        <div id="chat-input-row">
          <input id="chat-input" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()" />
          <button id="chat-send" onclick="sendMessage()">Send</button>
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML("beforeend", html);

    const history = [];

    function toggleChat() {
      const box = document.getElementById("chat-box");
      box.style.display = box.style.display === "flex" ? "none" : "flex";
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const send = document.getElementById("chat-send");
      const messages = document.getElementById("chat-messages");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      send.disabled = true;

      messages.innerHTML += `<div class="msg user">${text}</div>`;
      messages.innerHTML += `<div class="msg bot" id="typing">Typing...</div>`;
      messages.scrollTop = messages.scrollHeight;

      history.push({ role: "user", content: text });

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        const reply = data.reply;
        history.push({ role: "assistant", content: reply });
        document.getElementById("typing").outerHTML = `<div class="msg bot">${reply}</div>`;
      } catch {
        document.getElementById("typing").outerHTML = `<div class="msg bot">Sorry, something went wrong. Please try again.</div>`;
      }

      send.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
</html>
