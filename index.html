<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fort Reilly Foundation</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;700&display=swap");

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { background: #050505; color: #fff; font-family: Inter, sans-serif; }
      a { text-decoration: none; color: inherit; }
      img { display: block; max-width: 100%; }

      :root { --gold: #b79a5b; --light: #d8bd72; --soft: #cfcfcf; }

      .top-logo { background: #474741; border-bottom: 1px solid rgba(183,154,91,.25); display: flex; justify-content: center; align-items: center; padding: 15px 5%; overflow: hidden; }
      .top-logo img { height: 100px; object-fit: contain; }

      .floating-nav { position: sticky; top: 0; z-index: 10; background: rgba(8,8,8,.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(183,154,91,.3); display: flex; align-items: center; gap: 20px; padding-right: 3%; }
      .nav-logo img { height: 80px; }
      .nav-links { display: flex; gap: 26px; flex: 1; justify-content: center; align-items: center; }
      .nav-links a, .nav-donate, .btn, .chat-launcher, .chat-send, .chat-mode-btn { font-family: Oswald, sans-serif; text-transform: uppercase; letter-spacing: 1.3px; font-weight: 700; }
      .nav-links a { font-size: .88rem; opacity: .9; }
      .nav-links a:hover { color: var(--light); }
      .nav-donate, .btn-gold, .chat-launcher, .chat-send { background: linear-gradient(135deg, var(--light), var(--gold)); color: #050505; }
      .nav-donate { padding: 9px 18px; border-radius: 4px; }
      .hamburger { display: none; margin-left: auto; background: none; border: 0; padding: 12px; }
      .hamburger span { display: block; width: 25px; height: 2px; background: var(--light); margin: 5px; }

      .hero { position: relative; min-height: 82vh; display: flex; align-items: center; overflow: hidden; background: #000; }
      .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% top; filter: brightness(1.05); }
      .hero:after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,.75) 25%, rgba(0,0,0,.3) 50%, transparent), linear-gradient(to top, rgba(0,0,0,.5), transparent 50%); }
      .hero-content { position: relative; z-index: 1; max-width: 430px; padding: 60px 5%; }
      .hero h1, .section-title { font-family: Oswald, sans-serif; text-transform: uppercase; line-height: .95; letter-spacing: 1.5px; }
      .hero h1 { font-size: clamp(3rem, 7vw, 6rem); margin-bottom: 20px; }
      .hero-sub { color: var(--light); font-family: Oswald, sans-serif; text-transform: uppercase; letter-spacing: 2px; font-size: clamp(1rem, 2.5vw, 1.6rem); margin-bottom: 32px; }
      .hero-buttons { display: flex; gap: 14px; flex-wrap: wrap; }
      .btn { display: inline-flex; justify-content: center; align-items: center; min-width: 160px; padding: 15px 24px; border-radius: 4px; }
      .btn-outline { border: 1px solid var(--gold); background: rgba(0,0,0,.25); }

      section { padding: 85px 6%; }
      .section-title { font-size: clamp(2rem, 5vw, 3.4rem); margin-bottom: 22px; }
      .gold-line { width: 58px; height: 3px; background: var(--gold); margin-bottom: 22px; }
      .mission-section { background: linear-gradient(180deg, #151515, #080808); display: grid; grid-template-columns: 1.2fr repeat(4, 1fr); gap: 28px; border-block: 1px solid rgba(183,154,91,.18); }
      p { color: var(--soft); line-height: 1.7; }
      .mission-card { text-align: center; padding: 22px; border-left: 1px solid rgba(255,255,255,.12); }
      .mission-icon { color: var(--light); font-size: 2.8rem; margin-bottom: 16px; }
      .mission-card h3, .event-card h3, footer h3 { font-family: Oswald, sans-serif; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px; }
      .story-section { background: #050505; }
      .story-box { max-width: 900px; background: linear-gradient(180deg, #141414, #080808); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 42px; box-shadow: 0 25px 80px rgba(0,0,0,.45); }
      .events-section { background: #090909; }
      .events-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 34px; }
      .event-card { min-height: 210px; padding: 28px; border: 1px solid rgba(183,154,91,.25); border-radius: 8px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01)); }
      .event-date { color: var(--light); font-family: Oswald, sans-serif; margin-bottom: 16px; }
      footer { padding: 48px 6%; text-align: center; border-top: 1px solid rgba(183,154,91,.2); color: #aaa; }

      @media (max-width: 900px) {
        .top-logo { padding: 8px 12px; }
        .top-logo img { height: 90px; }
        .floating-nav { flex-wrap: wrap; }
        .nav-links { display: flex; justify-content: center; padding: 12px 0; gap: 18px; }
        .hero-content { max-width: 70%; margin: auto; }
        .btn { width: 100%; max-width: 300px; margin: auto; }
        .mission-section, .events-grid { grid-template-columns: 1fr; }
        .mission-card { border-left: 0; border-top: 1px solid rgba(255,255,255,.12); }
      }

      @media (max-width: 560px) {
        .hero-content { max-width: 76%; }
        section { padding: 64px 5%; }
        .story-box { padding: 26px; }
      }
    </style>
  </head>

  <body>
    <header class="top-logo"><img src="assets.gitkeep/fort-reilly-full-logo-web-small.png" alt="Fort Reilly Foundation" /></header>
    <nav class="floating-nav">
      <a class="nav-logo" href="#"><img src="assets.gitkeep/fr-shield.PNG" alt="FR Shield" /></a>
      <!-- Navigation content -->
    </nav>
    <main>
      <!-- Main content -->
    </main>
    <footer id="contact"><h3>Fort Reilly Foundation</h3><p>fortreillyfoundation.org</p></footer>
  </body>
</html>
