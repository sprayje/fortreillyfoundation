<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mandatory Fun Trivia</title><style>@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,sans-serif}a{color:inherit;text-decoration:none}:root{--gold:#b79a5b;--light:#d8bd72;--ink:#090909}.nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:10px 5%;background:rgba(8,8,8,.95);border-bottom:1px solid rgba(183,154,91,.3)}.nav img{height:58px}.nav div{display:flex;gap:18px;margin-left:auto}.nav a{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:1px}.wrap{min-height:100vh;padding:34px 5% 70px;background:radial-gradient(circle at 50% 0,rgba(216,189,114,.18),transparent 35%),linear-gradient(180deg,#161614,#050505)}.hero{text-align:center;max-width:1050px;margin:auto}.logo{height:100px;margin:auto auto 16px}.kicker{color:var(--light);font-family:Oswald,sans-serif;letter-spacing:3px;text-transform:uppercase}.hero h1{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:clamp(3rem,8vw,7rem);line-height:.88;margin:10px 0;color:#f4df9d;text-shadow:0 6px 0 #000}.hero h2{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:2px;margin:0 0 12px}.hero p{color:#ddd;font-size:1.1rem}.grid{display:grid;grid-template-columns:1fr 320px;gap:22px;max-width:1120px;margin:28px auto}.panel{background:linear-gradient(180deg,#171717,#0a0a0a);border:1px solid rgba(183,154,91,.35);border-radius:8px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{border:1px solid rgba(255,255,255,.09);padding:12px;border-radius:6px;background:#101010}.stat b{display:block;color:var(--light);font-family:Oswald,sans-serif;font-size:1.4rem}.question{font-size:clamp(1.4rem,3vw,2.3rem);font-weight:800;margin:12px 0 18px}.answers{display:grid;gap:12px}.answers button,.start,.save{border:1px solid rgba(216,189,114,.5);background:#111;color:#fff;text-align:left;padding:16px;border-radius:6px;font-weight:800;cursor:pointer;font-size:1rem}.answers button:hover,.start:hover,.save:hover{background:linear-gradient(135deg,var(--light),var(--gold));color:#050505}.answers button.good{background:#1f6f3a}.answers button.bad{background:#8d2525}.start,.save{text-align:center;background:linear-gradient(135deg,var(--light),var(--gold));color:#050505;text-transform:uppercase;font-family:Oswald,sans-serif;letter-spacing:1.4px}.feedback{min-height:28px;margin-top:14px;color:var(--light);font-weight:800}.leader h3{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:2rem;margin:0 0 12px}.leader ol{padding-left:24px}.leader li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}input{width:100%;padding:14px;border-radius:6px;border:1px solid rgba(216,189,114,.4);background:#0b0b0b;color:white;margin:12px 0}.hide{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.hud{grid-template-columns:repeat(2,1fr)}.nav div{display:none}.logo{height:80px}}</style></head><body><nav class="nav"><a href="../"><img src="../assets.gitkeep/fr-shield.PNG" alt="FR"></a><div><a href="../">Home</a><a href="../#about">About</a><a href="../#programs">Programs</a><a href="../#donate">Donate</a></div></nav><div class="wrap"><section class="hero"><img class="logo" src="../assets.gitkeep/fr-shield.PNG" alt="Fort Reilly Foundation"><div class="kicker">Mandatory Fun Trivia</div><h1>Mandatory Fun Trivia</h1><h2>Military and Veteran Trivia Challenge</h2><p>Test Your Knowledge of U.S. military history, service culture, ranks, traditions, and veteran resources.</p></section><section class="grid"><main class="panel"><div class="hud"><div class="stat">Score<b id="score">0</b></div><div class="stat">Streak<b id="streak">0</b></div><div class="stat">Round<b id="round">1</b></div><div class="stat">Timer<b id="timer">20</b></div></div><button class="start" id="start">Start the Round</button><div id="game" class="hide"><div class="kicker" id="cat"></div><div class="question" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></div><div id="over" class="hide"><h2 class="question">Game Over</h2><p id="summary"></p><input id="name" maxlength="16" placeholder="Enter callsign"><button class="save" id="save">Save Score</button><button class="start" id="again">Play Again</button></div></main><aside class="panel leader"><h3>Top 5 Leaderboard</h3><ol id="board"></ol></aside></section></div><script>const Q=[['Boot Camp','What does PT stand for?',['Physical Training','Platoon Timing','Patrol Team','Promotion Test'],0],['Boot Camp','What is reveille?',['Morning wake-up call','Evening meal','Inspection grade','Rifle range'],0],['Boot Camp','What is chow?',['Food or mealtime','A dress uniform','A convoy','A radio code'],0],['Boot Camp','What is a rack?',['Bed','Truck','Helmet','Medal'],0],['Boot Camp','What is an MRE?',['Meal, Ready-to-Eat','Military Radio Exercise','Marine Rifle Exam','Mission Route Entry'],0],['Boot Camp','What command means stop immediately?',['Halt','March','Port arms','Fall in'],0],['Boot Camp','What does AWOL mean?',['Absent Without Leave','Armed With Official License','Awaiting Orders List','Advanced Weapons Operator Level'],0],['Boot Camp','Who usually leads a platoon in formation?',['Platoon leader or sergeant','Cook','Chaplain','Supply clerk'],0],['History','Which branch was founded first?',['Army','Navy','Marine Corps','Air Force'],0],['History','When did the Air Force become separate?',['1947','1775','1865','1991'],0],['History','What day is Veterans Day observed?',['November 11','May 30','July 4','December 7'],0],['History','What does D-Day usually refer to?',['June 6, 1944 Normandy landings','Pearl Harbor','Iwo Jima flag raising','Armistice Day'],0],['History','Which war included the Battle of Chosin Reservoir?',['Korean War','Vietnam War','World War I','Gulf War'],0],['History','Who commanded Allied forces in Europe in WWII?',['Dwight D. Eisenhower','George Washington','Chester Nimitz','Douglas MacArthur'],0],['History','What is the oldest active U.S. military post?',['West Point','Fort Bragg','Fort Hood','Camp Pendleton'],0],['History','Which service operates aircraft carriers?',['Navy','Army','Coast Guard','Space Force'],0],['Service Culture','What is esprit de corps?',['Unit pride and morale','A pay grade','A field ration','A radio frequency'],0],['Service Culture','What does Oorah most closely connect with?',['Marine Corps motivation','Navy navigation','Army finance','Air Force maintenance'],0],['Service Culture','What is a challenge coin often used for?',['Recognition and unit pride','Paying fines','Buying uniforms','ID replacement'],0],['Service Culture','What is the correct response to a salute from a junior service member?',['Return the salute','Ignore it','Shake hands','Say at ease'],0],['Service Culture','What does NCO mean?',['Noncommissioned Officer','Naval Command Operator','National Cadet Office','New Combat Order'],0],['Service Culture','What is a guidon?',['Unit flag','Boot lace','Field meal','Medical form'],0],['Service Culture','What does PCS mean?',['Permanent Change of Station','Primary Combat School','Patrol Command Signal','Personal Clothing Supply'],0],['Service Culture','What does semper fidelis mean?',['Always faithful','Always ready','This we defend','Aim high'],0],['Veterans','What VA benefit helps pay for school?',['GI Bill','TRICARE Dental','MRE Card','Basic Allowance'],0],['Veterans','What hotline can veterans call by dialing then pressing 1?',['988 Veterans Crisis Line','411 Directory','311 City Services','811 Dig Line'],0],['Veterans','What VA benefit can help buy a home?',['VA home loan guaranty','Uniform allowance','Sea pay','Hazard pay'],0],['Veterans','What document commonly proves military discharge?',['DD Form 214','SF-86','W-4','DA Photo'],0],['Valor','Who was Chesty Puller?',['Highly decorated Marine lieutenant general','First Air Force pilot','Civil War president','Navy astronaut'],0],['Valor','Who is the youngest Medal of Honor recipient?',['Willie Johnston, age 13','Orion P. Howe, age 14','Jack Lucas, age 17','Audie Murphy, age 19'],0],['Valor','Audie Murphy is best known as what?',['One of WWII’s most decorated U.S. soldiers','First Navy SEAL','First Chairman of the Joint Chiefs','Founder of the Air Force'],0],['Valor','What medal is the highest U.S. military award for valor?',['Medal of Honor','Bronze Star','Purple Heart','Legion of Merit'],0]];let deck=[],i=0,score=0,streak=0,round=1,t=20,clock;const $=id=>document.getElementById(id);function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}function board(){let b=JSON.parse(localStorage.frTrivia||'[]');$('board').innerHTML=b.slice(0,5).map(x=>`<li><b>${x.name}</b> - ${x.score}</li>`).join('')||'<li>No scores yet</li>'}function start(){deck=shuffle(Q);i=score=streak=0;round=1;$('start').classList.add('hide');$('over').classList.add('hide');$('game').classList.remove('hide');show()}function show(){clearInterval(clock);t=20;$('timer').textContent=t;$('score').textContent=score;$('streak').textContent=streak;$('round').textContent=round;let x=deck[i%deck.length];$('cat').textContent=x[0];$('q').textContent=x[1];$('feedback').textContent='';$('answers').innerHTML=x[2].map((a,n)=>`<button onclick="answer(${n})">${String.fromCharCode(65+n)}. ${a}</button>`).join('');clock=setInterval(()=>{t--;$('timer').textContent=t;if(t<=0)end('Time expired. The mission clock got you.')},1000)}function answer(n){clearInterval(clock);let x=deck[i%deck.length],ok=n===x[3];[...$('answers').children].forEach((b,j)=>b.className=j===x[3]?'good':j===n?'bad':'');if(!ok)return setTimeout(()=>end('Wrong answer. Final score: '+score),650);streak++;round++;score+=100+t*5+streak*25+(streak%5?0:250);$('feedback').textContent='Correct! +' +(100+t*5+streak*25+(streak%5?0:250))+' points';i++;setTimeout(show,750)}function end(msg){clearInterval(clock);$('game').classList.add('hide');$('over').classList.remove('hide');$('summary').textContent=msg+' You cleared '+(round-1)+' questions.';$('score').textContent=score}$('save').onclick=()=>{let name=($('name').value||'PLAYER').toUpperCase();let b=JSON.parse(localStorage.frTrivia||'[]');b.push({name,score});b.sort((a,b)=>b.score-a.score);localStorage.frTrivia=JSON.stringify(b.slice(0,5));board()};$('start').onclick=start;$('again').onclick=start;board();</script></body></html>
